[project]
name = "jodal-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.133.1",
    "uvicorn==0.49.0",
    "pydantic==2.12.5",
    "litellm==1.93.0",
    "requests==2.32.3",
    "mcp==1.28.1",
    "tenacity==9.1.2",
    # 조달데이터허브 검색 엔진 (BM25 hybrid + 한국어 토크나이저).
    # mcp/ Worker 가 JS 로 재구현했던 것을 기존 Python 구현으로 되돌림:
    # Worker 의 "kiwi 근사" 정규식 토크나이저 대신 진짜 kiwipiepy 를 쓴다.
    "bm25s==0.3.11",   # meta.json 이 기록한 빌드 버전 — 인덱스 로드 호환성 고정
    "kiwipiepy==0.23.2",  # 동일 (meta.json 기록 버전)
    "numpy>=2.0",
    "onnxruntime>=1.30.0",
]

[tool.uv]
package = false
